<!-- Sanitized observed Gemini native clipboard upload card. The blob identity
     and synthetic PNG replace the disposable live test image, October 2026.
     Gemini exposes no filename, so the adapter verifies exact local blob bytes. -->
<div class="file-preview-container lm-enabled" aria-live="off">
  <gem-media-attachment class="gem-attachment gds-label-l gem-attachment-tile lm-enabled">
    <mat-basic-chip>
      <span><span><img class="gem-attachment-style-img" alt="attachment" src="blob:https://gemini.google.com/00000000-0000-4000-8000-000000000001"></span></span>
      <span class="gem-attachment-content"><gem-icon-button class="gem-attachment-close-button" arialabel="關閉附件"><button aria-label="關閉附件"></button></gem-icon-button></span>
    </mat-basic-chip>
  </gem-media-attachment>
</div>
