<!-- Sanitized observed loading component, October 2026. In the live page this
     belongs to infinite-scroller[data-test-id="chat-history-container"].
     Gemini replaces it with a durable DIV turn; it is never a final answer. -->
<pending-request class="conversation-container" scrollanchor>
  <user-query>
    <span class="user-query-container"><user-query-content class="user-query-container">
      <div class="user-query-container">
        <div class="file-preview-container"></div>
        <div class="query-content"><div class="query-bubble-with-status">
          <span class="user-query-bubble-with-background"><span class="horizontal-container">
            <div class="query-text" dir="ltr">
              <h5 class="cdk-visually-hidden screen-reader-user-query-label"><span>你說了</span> Question</h5>
              <p class="query-text-line">Question</p>
            </div>
          </span></span>
        </div></div>
      </div>
    </user-query-content></span>
  </user-query>
  <thinking-dots-animation><div class="thinking-dots-animation"></div></thinking-dots-animation>
  <pending-response><response-container><div class="response-container-content">
    <div class="gpi-static-text-loader"><span class="bot-name-ugc-label" aria-live="polite"></span></div>
  </div></response-container></pending-response>
</pending-request>
