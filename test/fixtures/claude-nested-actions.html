<!-- Sanitized structure observed read-only on Claude, 2026-10-19.
     Text and identifiers are synthetic; presentation-only classes/icons omitted. -->
<div data-testid="transcript-row" data-perf-row="assistant" data-perf-row-streaming="false" data-last-message="true">
  <div role="article">
    <div class="contents"><div data-transcript-row><div data-reply-scope>
      <div data-cds="AssistantMessage" data-testid="assistant-message" data-turn-key="fixture-answer" data-is-streaming="false">
        <h2 class="sr-only" data-find-omitted>Claude replied: fixture heading</h2>
        <div><div data-transcript-engine-root class="contents">
          <div data-cds="Prose"><div class="standard-markdown"><p>Current Claude answer.</p></div></div>
        </div></div>
        <div>
          <div data-cds="MessageActions" data-testid="message-actions" role="toolbar" aria-label="消息操作" data-reveal="fade" data-always-visible>
            <button type="button" data-cds="Button" aria-label="复制"><span data-cds="Icon" aria-hidden="true">icon</span></button>
            <span role="status" class="sr-only"></span>
            <button type="button" data-cds="Button" data-testid="action-bar-read-aloud" aria-label="朗读"></button>
            <button type="button" data-cds="Button" aria-label="回复很好" aria-pressed="false"></button>
            <button type="button" data-cds="Button" aria-label="回复不佳" aria-pressed="false"></button>
            <button type="button" data-cds="Button" data-testid="action-bar-retry" aria-label="重试"></button>
            <time data-cds="RelativeTime">3分钟前</time>
          </div>
        </div>
      </div>
    </div></div></div>
  </div>
</div>
